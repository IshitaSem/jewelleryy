<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - The Glam Aura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .account-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }
        .sidebar {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255,105,180,0.15);
            border: 3px dashed #ffb6c1;
            height: fit-content;
        }
        .sidebar h3 {
            font-family: 'Pacifico', cursive;
            color: #ff1493;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .sidebar-menu a, .sidebar-menu button {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 1.1rem;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            padding: 0.8rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            width: 100%;
        }
        .sidebar-menu a:hover, .sidebar-menu button:hover, .sidebar-menu a.active {
            background: #ffe4e1;
            color: #ff1493;
        }
        .main-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255,105,180,0.15);
        }
        .main-content h2 {
            font-family: 'Pacifico', cursive;
            color: #ff1493;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #ffe4e1;
            padding-bottom: 1rem;
        }
        
        /* Profile Details */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        .profile-item {
            background: #fff0f5;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border-left: 5px solid #ff69b4;
        }
        .profile-item label {
            display: block;
            font-size: 0.85rem;
            color: #ff69b4;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .profile-item input {
            width: 100%;
            background: transparent;
            border: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            outline: none;
        }
        .profile-item input:not(:read-only) {
            border-bottom: 2px dashed #ffb6c1;
            padding-bottom: 0.2rem;
        }
        .btn-update {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            box-shadow: 0 4px 10px rgba(255,105,180,0.3);
        }
        .btn-update:hover {
            background: #ff1493;
            transform: scale(1.05);
        }
        
        .status-msg {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #dc3545; }

        @media screen and (max-width: 768px) {
            .account-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="categories">
        <ul>
            <li><a href="index.html">← Back to Home 🐾</a></li>
            <li><a href="shopping-guide.html">Shopping Guide 📖</a></li>
        </ul>
    </nav>

    <div class="account-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>Welcome! ✨</h3>
            <ul class="sidebar-menu">
                <li><a href="account.html" class="active">My Profile</a></li>
                <li><a href="track-order.html">My Orders / Track</a></li>
                <li><button id="logoutBtn">Logout 🐾</button></li>
            </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <h2>Your Profile 💖</h2>
            <div id="statusMsg" class="status-msg"></div>

            <form id="profileForm">
                <div class="profile-grid">
                    <div class="profile-item">
                        <label>Full Name</label>
                        <input type="text" id="profileName" required>
                    </div>
                    <div class="profile-item">
                        <label>Email Address</label>
                        <input type="email" id="profileEmail" readonly title="Email cannot be changed">
                    </div>
                    <div class="profile-item">
                        <label>Phone Number</label>
                        <input type="tel" id="profilePhone" placeholder="For WhatsApp updates">
                    </div>
                    <div class="profile-item">
                        <label>Instagram Username</label>
                        <input type="text" id="profileInsta" placeholder="e.g. theglam._.aura">
                    </div>
                </div>
                <button type="submit" class="btn-update" id="updateProfileBtn">Save Changes ✨</button>
            </form>
        </div>
    </div>

    <script type="module" src="customer-auth.js"></script>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const profileForm = document.getElementById('profileForm');
        const updateBtn = document.getElementById('updateProfileBtn');
        const statusMsg = document.getElementById('statusMsg');

        function showMessage(msg, isError = false) {
            statusMsg.textContent = msg;
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg ' + (isError ? 'status-error' : 'status-success');
            setTimeout(() => statusMsg.style.display = 'none', 3000);
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) return; // customer-auth.js handles redirect

            try {
                // Pre-fill inputs instead of just textContent (which customer-auth.js tries to do)
                const userDoc = await getDoc(doc(db, "customers", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('profileName').value = data.fullName || "";
                    document.getElementById('profileEmail').value = data.email || user.email;
                    document.getElementById('profilePhone').value = data.phone || "";
                    document.getElementById('profileInsta').value = data.instagramUsername || "";
                }
            } catch(e) {
                console.error("Error loading profile data", e);
            }
        });

        profileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            updateBtn.disabled = true;
            updateBtn.innerHTML = 'Saving... 🐾';

            try {
                await updateDoc(doc(db, "customers", user.uid), {
                    fullName: document.getElementById('profileName').value.trim(),
                    phone: document.getElementById('profilePhone').value.trim(),
                    instagramUsername: document.getElementById('profileInsta').value.trim(),
                    updatedAt: new Date()
                });
                showMessage("Profile updated successfully! 💖");
            } catch (error) {
                console.error("Error updating profile", error);
                showMessage("Failed to update profile. Please try again.", true);
            } finally {
                updateBtn.disabled = false;
                updateBtn.innerHTML = 'Save Changes ✨';
            }
        });
    </script>
</body>
</html>
