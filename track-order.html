<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - The Glam Aura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .account-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }
        .sidebar {
            background: white;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255,105,180,0.15);
            border: 3px dashed #ffb6c1;
            height: fit-content;
            max-height: 80vh;
            overflow-y: auto;
        }
        .sidebar h3 {
            font-family: 'Pacifico', cursive;
            color: #ff1493;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            text-align: center;
        }
        
        .order-card-mini {
            background: #fff0f5;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .order-card-mini:hover, .order-card-mini.active {
            border-left-color: #ff69b4;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(255,105,180,0.2);
        }
        .order-card-mini h4 { color: #333; margin-bottom: 0.2rem; font-size: 0.9rem;}
        .order-card-mini p { font-size: 0.85rem; color: #666; margin-bottom: 0.2rem; }
        .order-card-mini .status-badge {
            display: inline-block;
            background: #ffb6c1;
            color: #333;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }

        .main-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255,105,180,0.15);
        }
        
        #noOrdersMsg {
            text-align: center;
            color: #ff69b4;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 3rem;
            display: none;
        }
        
        .order-detail-header {
            border-bottom: 2px dashed #ffe4e1;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .order-detail-header h2 {
            font-family: 'Pacifico', cursive;
            color: #ff1493;
            font-size: 2rem;
        }

        .timeline-container {
            margin: 2rem 0;
            padding-left: 1rem;
        }
        .timeline-item {
            position: relative;
            padding-left: 2rem;
            padding-bottom: 1.5rem;
            border-left: 3px solid #ffe4e1;
        }
        .timeline-item:last-child {
            border-left-color: transparent;
        }
        .timeline-item::before {
            content: "";
            position: absolute;
            left: -10px;
            top: 0;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #ffe4e1;
            border: 3px solid white;
        }
        .timeline-item.completed {
            border-left-color: #ff69b4;
        }
        .timeline-item.completed::before {
            background: #ff69b4;
        }
        .timeline-item.current::before {
            background: #ff1493;
            box-shadow: 0 0 0 3px rgba(255, 20, 147, 0.2);
        }
        .timeline-date {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.2rem;
        }
        .timeline-status {
            font-weight: bold;
            color: #333;
            font-size: 1.1rem;
        }
        .timeline-msg {
            font-size: 0.9rem;
            color: #555;
            margin-top: 0.3rem;
            background: #fff0f5;
            padding: 0.5rem;
            border-radius: 8px;
            display: inline-block;
        }

        .order-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            background: #fafafa;
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }
        
        .order-items-list {
            margin-bottom: 2rem;
        }
        .order-item-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid #ffe4e1;
        }
        .order-item-row img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .btn-action {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }
        .btn-action:hover { background: #ff1493; }

        @media screen and (max-width: 768px) {
            .account-container { grid-template-columns: 1fr; }
            .order-info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="categories">
        <ul>
            <li><a href="account.html">← Back to Profile</a></li>
            <li><a href="shopping-guide.html">Shopping Guide 📖</a></li>
        </ul>
    </nav>

    <div class="account-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>My Orders 🛍️</h3>
            <div id="orderListContainer">
                <p style="text-align:center; color:#666;">Loading...</p>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content" id="mainDetailView" style="display:none;">
            <div class="order-detail-header">
                <h2 id="detailOrderNumber">Order #...</h2>
                <div>
                    <span id="detailPaymentStatus" class="status-badge" style="background:#d4edda; color:#155724; padding:0.4rem 0.8rem; border-radius:15px; font-weight:bold; margin-right:10px;">Payment Status</span>
                    <a href="https://instagram.com/direct/new/?username=theglam._.aura" target="_blank" class="btn-action">Contact Glam Aura 💬</a>
                </div>
            </div>

            <!-- TIMELINE -->
            <div class="timeline-container" id="timelineContainer">
                <!-- Injected via JS -->
            </div>

            <!-- CUSTOMER INFO -->
            <div class="order-info-grid">
                <div>
                    <h4 style="color:#ff1493; margin-bottom:0.5rem; font-family:'Pacifico', cursive;">Shipping Address</h4>
                    <p id="detailName" style="font-weight:bold;"></p>
                    <p id="detailAddress"></p>
                    <p id="detailPhone"></p>
                </div>
                <div>
                    <h4 style="color:#ff1493; margin-bottom:0.5rem; font-family:'Pacifico', cursive;">Order Summary</h4>
                    <p>Total Amount: <strong style="font-size:1.2rem; color:#ff69b4;" id="detailTotal">₹0</strong></p>
                    <p>Date: <span id="detailDate"></span></p>
                    <div id="shippingInfoBox" style="display:none; margin-top:0.5rem; background:#fff0f5; padding:0.5rem; border-radius:5px;">
                        <strong>Courier:</strong> <span id="detailCourier"></span><br>
                        <strong>Tracking:</strong> <span id="detailTracking"></span>
                    </div>
                </div>
            </div>

            <!-- ITEMS -->
            <h4 style="color:#ff1493; font-family:'Pacifico', cursive; margin-bottom:1rem; font-size:1.3rem;">Items Ordered</h4>
            <div class="order-items-list" id="detailItems">
                <!-- Injected via JS -->
            </div>
        </div>
        
        <div id="noOrdersMsg">
            You haven't placed any orders yet! 🐾<br>
            <a href="index.html" class="btn-action" style="margin-top:1rem;">Shop Now</a>
        </div>
    </div>

    <script type="module" src="customer-auth.js"></script>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        let userOrders = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const q = query(collection(db, "orders"), where("userId", "==", user.uid));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((doc) => {
                    userOrders.push({ id: doc.id, ...doc.data() });
                });

                // Sort descending by date (in JS to avoid needing Firestore composite indexes)
                userOrders.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });

                renderOrderSidebar();
            } catch (error) {
                console.error("Error fetching orders:", error);
                document.getElementById('orderListContainer').innerHTML = `<p style="color:red;text-align:center;">Failed to load orders.</p>`;
            }
        });

        function renderOrderSidebar() {
            const container = document.getElementById('orderListContainer');
            if (userOrders.length === 0) {
                container.style.display = 'none';
                document.getElementById('noOrdersMsg').style.display = 'block';
                return;
            }

            container.innerHTML = '';
            userOrders.forEach((order, index) => {
                const dateStr = order.createdAt ? new Date(order.createdAt.toMillis()).toLocaleDateString() : 'Unknown Date';
                
                const card = document.createElement('div');
                card.className = 'order-card-mini';
                card.innerHTML = `
                    <h4>#${order.orderNumber}</h4>
                    <p>${dateStr} • ₹${order.total}</p>
                    <span class="status-badge">${order.orderStatus || 'Processing'}</span>
                `;
                card.onclick = () => {
                    document.querySelectorAll('.order-card-mini').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    showOrderDetails(order);
                };
                container.appendChild(card);
            });

            // Auto-select first order
            if (userOrders.length > 0) {
                container.firstChild.click();
            }
        }

        function showOrderDetails(order) {
            document.getElementById('mainDetailView').style.display = 'block';
            
            document.getElementById('detailOrderNumber').textContent = `Order #${order.orderNumber}`;
            document.getElementById('detailPaymentStatus').textContent = `${order.paymentMethod} - ${order.paymentStatus}`;
            
            const c = order.customer;
            document.getElementById('detailName').textContent = c.name;
            document.getElementById('detailAddress').innerHTML = `${c.address}`;
            document.getElementById('detailPhone').textContent = `Phone: ${c.phone}`;
            
            document.getElementById('detailTotal').textContent = `₹${order.total}`;
            document.getElementById('detailDate').textContent = order.createdAt ? new Date(order.createdAt.toMillis()).toLocaleString() : 'N/A';

            // Shipping Info
            const shipBox = document.getElementById('shippingInfoBox');
            if (order.courier || order.trackingNumber) {
                shipBox.style.display = 'block';
                document.getElementById('detailCourier').textContent = order.courier || 'N/A';
                document.getElementById('detailTracking').textContent = order.trackingNumber || 'N/A';
            } else {
                shipBox.style.display = 'none';
            }

            // Timeline
            const timelineContainer = document.getElementById('timelineContainer');
            timelineContainer.innerHTML = '';
            const history = order.statusHistory || [];
            
            history.forEach((h, i) => {
                const isLast = (i === history.length - 1);
                const dateStr = h.timestamp ? new Date(h.timestamp.toMillis()).toLocaleString() : '';
                
                timelineContainer.innerHTML += `
                    <div class="timeline-item completed ${isLast ? 'current' : ''}">
                        <div class="timeline-date">${dateStr}</div>
                        <div class="timeline-status">${h.status}</div>
                        ${h.message ? `<div class="timeline-msg">💬 ${h.message}</div>` : ''}
                    </div>
                `;
            });

            // Items
            const itemsContainer = document.getElementById('detailItems');
            itemsContainer.innerHTML = '';
            if (order.items) {
                order.items.forEach(item => {
                    itemsContainer.innerHTML += `
                        <div class="order-item-row">
                            <img src="${item.image}" alt="${item.name}">
                            <div style="flex:1;">
                                <div style="font-weight:bold; color:#333;">${item.name}</div>
                                <div style="font-size:0.9rem; color:#666;">Qty: ${item.quantity}</div>
                            </div>
                            <div style="font-weight:bold; color:#ff1493;">₹${item.price * item.quantity}</div>
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
